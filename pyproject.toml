version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DurgeshKumar97", email = "12duklan.durgesh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "litellm>=1.110.2",
    "litelm>=0.7.0",
    "pypdf>=7.1.1",
